<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comandas - Ricken Bebidas</title>
    <!-- Biblioteca para ler arquivos Excel (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --bg: #121212; --card: #1e1e1e; --card-hover: #2a2a2a;
            --primary: #f5c71a; --primary-hover: #dfb213;
            --text: #f3f4f6; --text-muted: #9ca3af;
            --border: #333333; --danger: #ef4444;
            --success: #10b981; --info: #3b82f6;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .hidden { display: none !important; }
        input, select { 
            width: 100%; padding: 0.8rem; margin-top: 0.5rem; 
            background: #2a2a2a; border: 1px solid var(--border); 
            color: var(--text); border-radius: 6px; box-sizing: border-box; 
        }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        button { 
            background: var(--primary); color: #000; border: none; cursor: pointer; 
            font-weight: bold; padding: 0.8rem; border-radius: 6px; transition: 0.2s;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        
        #login-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: var(--card); padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); width: 320px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
        
        nav { background: var(--card); padding: 1rem; display: flex; gap: 0.8rem; border-bottom: 2px solid var(--primary); overflow-x: auto; white-space: nowrap; }
        nav button { background: transparent; color: var(--text); border: 1px solid var(--border); }
        nav button:hover { background: var(--primary); color: #000; border-color: var(--primary); }
        .btn-sair { margin-left: auto; border-color: var(--danger) !important; color: var(--danger) !important; }
        .btn-sair:hover { background: var(--danger) !important; color: white !important; }
        
        .container { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
        
        /* GRIDS E CARDS */
        .comandas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .comanda-card, .history-card { 
            background: var(--card); padding: 1rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            border: 1px solid var(--border); display: flex; flex-direction: column; 
        }
        .comanda-card { border-top: 4px solid var(--primary); }
        .history-card { border-top: 4px solid var(--info); }
        
        .btn-toggle-itens { background: transparent; color: var(--text-muted); border: 1px solid var(--border); margin: 0.5rem 0; padding: 0.4rem; font-size: 0.85rem; width: 100%; text-align: left; }
        .btn-toggle-itens:hover { color: var(--primary); border-color: var(--primary); }
        
        .item-list { font-size: 0.85rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; flex-grow: 1; max-height: 200px; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; background: var(--card-hover); padding: 0.3rem 0.5rem; border-radius: 6px; gap: 6px; }
        .item-info { display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .item-qtd { font-weight: bold; color: var(--primary); margin-right: 6px; }
        .item-actions { display: flex; gap: 4px; align-items: center; }
        
        .btn-mini { padding: 4px 6px; font-size: 0.75rem; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-qty { background: var(--border); color: var(--text); }
        .btn-qty:hover { background: var(--primary); color: #000; }
        .btn-edit { background: var(--info); color: white; }
        .btn-del { background: var(--danger); color: white; }
        
        .category-box { background: var(--card); padding: 1.2rem; margin-bottom: 1.2rem; border-radius: 8px; border: 1px solid var(--border); }
        .category-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 0.8rem; padding-bottom: 0.5rem; color: var(--primary); font-size: 1.2rem; margin-top: 0; }
        
        /* MODAIS CUSTOMIZADOS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card); padding: 1.5rem; border-radius: 12px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid var(--primary); display: flex; flex-direction: column; }
        .close-btn { position: absolute; right: 1rem; top: 1rem; background: var(--card-hover); color: var(--text); border: 1px solid var(--border); border-radius: 50%; width: 35px; height: 35px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }
        
        .grid-categorias-modal, .grid-produtos-modal { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; margin-top: 1rem; }
        .btn-categoria { flex: 1 1 calc(50% - 0.6rem); background: var(--card-hover); border: 1px solid var(--border); padding: 1.5rem 1rem; border-radius: 8px; font-size: 1.1rem; font-weight: bold; color: var(--primary); cursor: pointer; text-align: center; }
        .btn-categoria:hover { background: var(--primary); color: #000; }
        
        .produto-btn { background: var(--card-hover); border: 1px solid var(--border); padding: 0.8rem; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; flex: 1 1 calc(50% - 0.6rem); color: var(--text); }
        .produto-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }
        .produto-btn span.nome { font-weight: bold; font-size: 0.95rem; text-align: center;}
        .produto-btn span.preco { font-size: 0.85rem; margin-top: 0.3rem; color: var(--text-muted); }

        .btn-voltar { background: transparent; color: var(--text); border: 1px solid var(--text-muted); padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem; align-self: flex-start; }
        .btn-voltar:hover { background: var(--border); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top: 0; color: var(--primary); text-align: center;">Acesso ao Sistema</h2>
            <input type="email" id="login-email" placeholder="E-mail">
            <input type="password" id="login-pass" placeholder="Senha">
            <button onclick="fazerLogin()" style="width: 100%; margin-top: 1.5rem; font-size: 1.1rem;">Entrar</button>
            <p id="login-error" style="color: var(--danger); font-size: 0.9rem; margin-top: 1rem; display: none;"></p>
        </div>
    </div>

    <!-- Interface Principal -->
    <div id="app-screen" class="hidden">
        <nav>
            <button onclick="mudarAba('comandas')">📝 Comandas</button>
            <button onclick="mudarAba('produtos')">📦 Estoque</button>
            <button onclick="mudarAba('historico')">🕰️ Histórico</button>
            <button onclick="mudarAba('config')">⚙️ Configurações</button>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </nav>

        <div class="container">
            <!-- Aba Comandas -->
            <div id="aba-comandas" class="aba">
                <h2 style="color: var(--primary); margin-top: 0;">Comandas Ativas</h2>
                <div style="display: flex; gap: 0.5rem; max-width: 500px; margin-bottom: 1rem;">
                    <input type="text" id="novo-cliente" placeholder="Nome do Cliente ou Mesa" style="margin-top:0;">
                    <button onclick="novaComanda()" style="margin: 0; width: 120px;">+ Criar</button>
                </div>
                <div class="comandas-grid" id="grid-comandas"></div>
            </div>

            <!-- Aba Produtos (Estoque) -->
            <div id="aba-produtos" class="aba hidden">
                <h2 style="color: var(--primary); margin-top: 0;">Catálogo de Produtos</h2>
                <div style="display: flex; gap: 0.5rem; max-width: 600px; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <button onclick="novaCategoria()">+ Nova Categoria</button>
                    <input type="text" id="busca-estoque" placeholder="🔍 Buscar produto ou categoria..." onkeyup="pesquisarEstoque()" style="flex:1; margin-top:0; min-width: 250px;">
                </div>
                <div id="lista-categorias-admin"></div>
            </div>

            <!-- Aba Histórico -->
            <div id="aba-historico" class="aba hidden">
                <h2 style="color: var(--primary); margin-top: 0;">Comandas Finalizadas</h2>
                <input type="text" id="busca-historico" placeholder="🔍 Buscar cliente ou data..." onkeyup="pesquisarHistorico()" style="max-width: 400px; margin-bottom: 1.5rem;">
                <div class="comandas-grid" id="lista-historico"></div>
            </div>

            <!-- Aba Configurações -->
            <div id="aba-config" class="aba hidden">
                <h2 style="color: var(--primary); margin-top: 0;">Configurações</h2>
                
                <!-- Sessão de Importar Planilha -->
                <div style="max-width: 500px; background: var(--card); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 2rem;">
                    <h3 style="margin-top:0; color: var(--info);">📊 Importar Estoque (Excel / CSV)</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">
                        Suba uma planilha <b>.xlsx</b> ou <b>.csv</b>. A primeira linha deve conter os cabeçalhos:<br> 
                        <strong style="color: var(--text);">Categoria | Produto | Valor</strong>
                    </p>
                    <input type="file" id="file-excel" accept=".xlsx, .xls, .csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel">
                    <button onclick="importarExcel()" style="width: 100%; margin-top: 1rem; background: var(--info); color: white;">Carregar Planilha</button>
                </div>

                <div style="max-width: 500px; background: var(--card); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border);">
                    <h3 style="margin-top:0; color: var(--danger);">🔒 Segurança (Trocar Usuário)</h3>
                    <label style="color: var(--text-muted); font-size: 0.9rem;">Novo E-mail</label>
                    <input type="email" id="config-user" placeholder="Digite o novo e-mail">
                    <label style="display:block; margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem;">Nova Senha (Mín. 6 letras/números)</label>
                    <input type="password" id="config-pass" placeholder="Digite a nova senha">
                    <button onclick="criarNovoUsuario()" style="width: 100%; margin-top: 1.5rem; background: var(--danger); color: white;">Criar e Trocar Usuário</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Produtos na Comanda -->
    <div id="modal-produtos" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="fecharModal()">X</button>
            <h2 style="margin-top: 0; color: var(--primary); font-size: 1.3rem;">Adicionar Item</h2>
            <input type="text" id="modal-search" placeholder="🔍 Buscar produto pelo nome..." onkeyup="pesquisarProdutoModal()" style="margin-bottom: 1rem;">
            
            <div id="modal-view-categorias" class="grid-categorias-modal"></div>

            <div id="modal-view-itens" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
                <button class="btn-voltar" onclick="voltarParaCategorias()">⬅ Voltar</button>
                <h3 id="titulo-categoria-modal" style="margin-top: 0; color: var(--text-muted); font-size: 1.1rem;"></h3>
                <div id="modal-lista-produtos" class="grid-produtos-modal"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0 1rem 0;">
            <button onclick="adicionarItemManual()" style="background: transparent; color: var(--text); border: 1px dashed var(--border); width: 100%; margin: 0; padding: 0.6rem;">
                ✍️ Adicionar Item Avulso (Manual)
            </button>
        </div>
    </div>

    <!-- MODAL DE DIÁLOGO CUSTOMIZADO (SUBSTITUI PROMPT, ALERT E CONFIRM) -->
    <div id="custom-dialog-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h3 id="dialog-title" style="margin-top: 0; color: var(--primary);">Ricken Bebidas</h3>
            <p id="dialog-message" style="color: var(--text); font-size: 0.95rem; margin-bottom: 1.2rem; white-space: pre-line;"></p>
            <div id="dialog-inputs" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.2rem;"></div>
            <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button id="dialog-btn-cancel" class="btn-voltar" style="margin: 0; flex: 1; border-color: var(--border);">Cancelar</button>
                <button id="dialog-btn-confirm" style="flex: 1;">OK</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMHXpVGV3PCUwZnuNIdZ3acqHbSqlRers",
            authDomain: "bebidas-6936f.firebaseapp.com",
            projectId: "bebidas-6936f",
            storageBucket: "bebidas-6936f.firebasestorage.app",
            messagingSenderId: "370812230774",
            appId: "1:370812230774:web:14fc36079d25b96da7d357",
            measurementId: "G-SHQSWZR7XP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let comandas = [];
        let historico = [];
        let catalogo = [];
        let comandaAtualId = null; 

        // --- CORREÇÃO DE ACENTUAÇÃO E UTF-8 ---
        function fixEncoding(str) {
            if (typeof str !== 'string') return str;
            try {
                if (/[\xC2-\xF4][\x80-\xBF]/.test(str)) {
                    return decodeURIComponent(escape(str));
                }
            } catch (e) {}
            return str;
        }

        // --- SISTEMA DE DIÁLOGOS CUSTOMIZADOS (SEM POPUPS DO NAVEGADOR) ---
        window.customAlert = (msg, onOk) => {
            const modal = document.getElementById('custom-dialog-modal');
            document.getElementById('dialog-title').innerText = 'Ricken Bebidas';
            document.getElementById('dialog-message').innerText = fixEncoding(msg);
            document.getElementById('dialog-inputs').innerHTML = '';
            
            const btnCancel = document.getElementById('dialog-btn-cancel');
            const btnConfirm = document.getElementById('dialog-btn-confirm');
            
            btnCancel.classList.add('hidden');
            btnConfirm.innerText = 'OK';
            modal.classList.remove('hidden');
            
            btnConfirm.onclick = () => {
                modal.classList.add('hidden');
                if (onOk) onOk();
            };
        };

        window.customConfirm = (msg, onConfirm) => {
            const modal = document.getElementById('custom-dialog-modal');
            document.getElementById('dialog-title').innerText = 'Confirmação';
            document.getElementById('dialog-message').innerText = fixEncoding(msg);
            document.getElementById('dialog-inputs').innerHTML = '';
            
            const btnCancel = document.getElementById('dialog-btn-cancel');
            const btnConfirm = document.getElementById('dialog-btn-confirm');
            
            btnCancel.classList.remove('hidden');
            btnCancel.innerText = 'Cancelar';
            btnConfirm.innerText = 'Confirmar';
            modal.classList.remove('hidden');
            
            btnCancel.onclick = () => modal.classList.add('hidden');
            btnConfirm.onclick = () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm();
            };
        };

        window.customPrompt = (title, fields, onSubmit) => {
            const modal = document.getElementById('custom-dialog-modal');
            document.getElementById('dialog-title').innerText = fixEncoding(title);
            document.getElementById('dialog-message').innerText = '';
            
            const inputsContainer = document.getElementById('dialog-inputs');
            inputsContainer.innerHTML = '';
            
            fields.forEach(f => {
                const wrapper = document.createElement('div');
                wrapper.style.textAlign = 'left';
                if (f.label) {
                    wrapper.innerHTML += `<label style="font-size:0.85rem; color:var(--text-muted);">${fixEncoding(f.label)}</label>`;
                }
                const input = document.createElement('input');
                input.id = `prompt-field-${f.id}`;
                input.type = f.type || 'text';
                input.value = f.value !== undefined ? fixEncoding(String(f.value)) : '';
                input.placeholder = f.placeholder ? fixEncoding(f.placeholder) : '';
                input.style.marginTop = '0.2rem';
                wrapper.appendChild(input);
                inputsContainer.appendChild(wrapper);
            });
            
            const btnCancel = document.getElementById('dialog-btn-cancel');
            const btnConfirm = document.getElementById('dialog-btn-confirm');
            
            btnCancel.classList.remove('hidden');
            btnCancel.innerText = 'Cancelar';
            btnConfirm.innerText = 'Salvar';
            modal.classList.remove('hidden');
            
            setTimeout(() => {
                const firstInput = inputsContainer.querySelector('input');
                if (firstInput) firstInput.focus();
            }, 100);
            
            btnCancel.onclick = () => modal.classList.add('hidden');
            btnConfirm.onclick = () => {
                let results = {};
                fields.forEach(f => {
                    results[f.id] = document.getElementById(`prompt-field-${f.id}`).value;
                });
                modal.classList.add('hidden');
                if (onSubmit) onSubmit(results);
            };
        };

        // --- AUTENTICAÇÃO ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                iniciarSincronizacao();
            } else {
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        window.fazerLogin = () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(() => {
                const err = document.getElementById('login-error');
                err.innerText = "E-mail ou senha incorretos.";
                err.style.display = 'block';
            });
        };
        window.sair = () => signOut(auth);

        window.criarNovoUsuario = () => {
            const email = document.getElementById('config-user').value;
            const pass = document.getElementById('config-pass').value;
            if(!email || pass.length < 6) return customAlert("Preencha um e-mail válido e senha com 6+ caracteres.");
            createUserWithEmailAndPassword(auth, email, pass).then(() => {
                customAlert("Usuário criado com sucesso!");
                document.getElementById('config-user').value = '';
                document.getElementById('config-pass').value = '';
            }).catch(e => customAlert("Erro ao criar usuário: " + e.message));
        };
        
        window.mudarAba = (abaId) => {
            document.querySelectorAll('.aba').forEach(aba => aba.classList.add('hidden'));
            document.getElementById(`aba-${abaId}`).classList.remove('hidden');
        };

        // --- SINCRONIZAÇÃO ---
        function iniciarSincronizacao() {
            onSnapshot(collection(db, "comandas"), (snapshot) => {
                comandas = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderizarComandas();
            });
            onSnapshot(query(collection(db, "historico"), orderBy("dataTimestamp", "desc")), (snapshot) => {
                historico = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderizarHistorico();
            });
            onSnapshot(doc(db, "sistema", "catalogo"), (docSnap) => {
                catalogo = docSnap.exists() ? (docSnap.data().categorias || []) : [];
                renderizarAbaProdutos();
            });
        }

        // --- TOGGLES DE LISTA ---
        window.toggleItensGerais = (elementId, btnId) => {
            const lista = document.getElementById(elementId);
            const btn = document.getElementById(btnId);
            if (lista.classList.contains('hidden')) {
                lista.classList.remove('hidden');
                btn.innerText = btn.innerText.replace('🔽 Ver', '🔼 Ocultar');
            } else {
                lista.classList.add('hidden');
                btn.innerText = btn.innerText.replace('🔼 Ocultar', '🔽 Ver');
            }
        };

        // --- COMANDAS LÓGICA ---
        window.novaComanda = async () => {
            const nome = document.getElementById('novo-cliente').value.trim();
            if (!nome) return customAlert('Digite o nome do cliente ou da mesa.');
            await addDoc(collection(db, "comandas"), { cliente: fixEncoding(nome), itens: [], total: 0 });
            document.getElementById('novo-cliente').value = '';
        };

        function renderizarComandas() {
            const grid = document.getElementById('grid-comandas');
            grid.innerHTML = '';
            comandas.forEach(c => {
                const qtdItens = c.itens.reduce((acc, i) => acc + (i.quantidade || 1), 0);
                let itensHTML = c.itens.map((i, idx) => {
                    const qtd = i.quantidade || 1;
                    return `
                        <div class="item-row">
                            <div class="item-info"><span class="item-qtd">${qtd}x</span> <span title="${fixEncoding(i.nome)}">${fixEncoding(i.nome)}</span></div>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <span style="font-size:0.8rem; color:var(--text-muted);">R$ ${(i.valor * qtd).toFixed(2)}</span>
                                <div class="item-actions">
                                    <button class="btn-mini btn-qty" onclick="alterarQtd('${c.id}', ${idx}, -1)">-</button>
                                    <button class="btn-mini btn-qty" onclick="alterarQtd('${c.id}', ${idx}, 1)">+</button>
                                    <button class="btn-mini btn-del" onclick="removerItemComanda('${c.id}', ${idx})">🗑️</button>
                                </div>
                            </div>
                        </div>`;
                }).join('');
                
                grid.innerHTML += `
                    <div class="comanda-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="margin:0; color: var(--primary); font-size: 1.2rem;">${fixEncoding(c.cliente)}</h3>
                            <button class="btn-mini btn-edit" onclick="editarNomeCliente('${c.id}')">✏️ Edit</button>
                        </div>
                        <h3 style="margin: 0.8rem 0 0.2rem 0; font-size: 1.3rem;">R$ ${c.total.toFixed(2)}</h3>
                        
                        <button id="btn-toggle-com-${c.id}" class="btn-toggle-itens" onclick="toggleItensGerais('itens-com-${c.id}', 'btn-toggle-com-${c.id}')">
                            🔽 Ver Itens (${qtdItens})
                        </button>
                        <div id="itens-com-${c.id}" class="item-list hidden">
                            ${itensHTML || '<em style="color:var(--text-muted); font-size: 0.8rem;">Vazio...</em>'}
                        </div>
                        
                        <div style="display:flex; gap:0.5rem; margin-top: auto;">
                            <button onclick="abrirModalProdutos('${c.id}')" style="flex:1; padding: 0.6rem;">+ Adicionar</button>
                            <button onclick="finalizarComanda('${c.id}')" style="background:var(--success); color:white; flex:1; padding: 0.6rem;">✔ Fechar</button>
                        </div>
                    </div>`;
            });
        }

        window.alterarQtd = async (comandaId, itemIndex, delta) => {
            const comanda = comandas.find(c => c.id === comandaId);
            comanda.itens[itemIndex].quantidade = (comanda.itens[itemIndex].quantidade || 1) + delta;
            if (comanda.itens[itemIndex].quantidade <= 0) comanda.itens.splice(itemIndex, 1);
            const total = comanda.itens.reduce((acc, item) => acc + (item.valor * (item.quantidade || 1)), 0);
            await updateDoc(doc(db, "comandas", comandaId), { itens: comanda.itens, total: total });
        };
        window.removerItemComanda = (comandaId, itemIndex) => {
            customConfirm("Deseja remover este item da comanda?", async () => {
                const comanda = comandas.find(c => c.id === comandaId);
                comanda.itens.splice(itemIndex, 1);
                const total = comanda.itens.reduce((acc, it) => acc + (it.valor * (it.quantidade || 1)), 0);
                await updateDoc(doc(db, "comandas", comandaId), { itens: comanda.itens, total: total });
            });
        };
        window.editarNomeCliente = (comandaId) => {
            const comanda = comandas.find(c => c.id === comandaId);
            customPrompt("Editar Nome", [{ id: 'nome', label: 'Nome do Cliente ou Mesa', value: comanda.cliente }], async (res) => {
                if (res.nome && res.nome.trim() !== "") {
                    await updateDoc(doc(db, "comandas", comandaId), { cliente: fixEncoding(res.nome.trim()) });
                }
            });
        };
        window.finalizarComanda = (id) => {
            customConfirm("Fechar comanda e enviar para o histórico?", async () => {
                const comanda = comandas.find(c => c.id === id);
                await addDoc(collection(db, "historico"), { ...comanda, dataFinalizacao: new Date().toLocaleString('pt-BR'), dataTimestamp: Date.now() });
                await deleteDoc(doc(db, "comandas", id));
            });
        };

        // --- ESTOQUE LÓGICA E PESQUISA ---
        window.pesquisarEstoque = () => renderizarAbaProdutos(document.getElementById('busca-estoque').value);

        function renderizarAbaProdutos(filtro = '') {
            const adminLista = document.getElementById('lista-categorias-admin');
            adminLista.innerHTML = '';
            const termo = filtro.toLowerCase().trim();

            catalogo.forEach((cat, indexCat) => {
                const catNomeFix = fixEncoding(cat.nomeCat);
                const itensFiltrados = cat.itens.map((i, indexItem) => ({ ...i, originalIndex: indexItem }))
                    .filter(i => termo === '' || fixEncoding(i.nome).toLowerCase().includes(termo) || catNomeFix.toLowerCase().includes(termo));
                
                if (termo !== '' && itensFiltrados.length === 0 && !catNomeFix.toLowerCase().includes(termo)) return;

                const isExpanded = termo !== '' ? '' : 'hidden';
                const btnText = termo !== '' ? '🔼 Ocultar Produtos' : '🔽 Ver Produtos';

                let itensCatHTML = itensFiltrados.map(i => `
                    <div class="item-row">
                        <span>${fixEncoding(i.nome)} - <strong style="color:var(--primary);">R$ ${i.valor.toFixed(2)}</strong></span>
                        <div class="item-actions">
                            <button class="btn-mini btn-edit" onclick="editarProdutoEstoque(${indexCat}, ${i.originalIndex})">✏️</button>
                            <button class="btn-mini btn-del" onclick="excluirProdutoEstoque(${indexCat}, ${i.originalIndex})">🗑️</button>
                        </div>
                    </div>`).join('');

                adminLista.innerHTML += `
                    <div class="category-box">
                        <div class="category-title">
                            <span>${catNomeFix}</span>
                            <button class="btn-mini btn-del" onclick="excluirCategoria(${indexCat})">🗑️ Excluir Categoria</button>
                        </div>
                        <button id="btn-toggle-est-${indexCat}" class="btn-toggle-itens" onclick="toggleItensGerais('itens-est-${indexCat}', 'btn-toggle-est-${indexCat}')" style="margin-bottom:0.8rem; border-color:var(--border);">
                            ${btnText} (${cat.itens.length})
                        </button>
                        <div id="itens-est-${indexCat}" class="${isExpanded}">
                            ${itensCatHTML || '<p style="color:var(--text-muted); font-size:0.9rem;">Vazio.</p>'}
                        </div>
                        <button onclick="novoProdutoNaCategoria(${indexCat})" style="margin-top: 1rem; width: auto; font-size: 0.9rem; background:transparent; color:var(--text); border:1px solid var(--border);">
                            + Adicionar Produto Aqui
                        </button>
                    </div>`;
            });
        }
        
        async function salvarCatalogoNoFirebase() { await setDoc(doc(db, "sistema", "catalogo"), { categorias: catalogo }); }
        
        window.novaCategoria = () => {
            customPrompt("Nova Categoria", [{ id: 'nome', label: 'Nome da Categoria (Ex: Cervejas, Combos)' }], async (res) => {
                if (res.nome && res.nome.trim() !== "") {
                    catalogo.push({ nomeCat: fixEncoding(res.nome.trim()), itens: [] });
                    await salvarCatalogoNoFirebase();
                }
            });
        };
        window.novoProdutoNaCategoria = (indexCat) => {
            customPrompt("Novo Produto", [
                { id: 'nome', label: 'Nome do Produto' },
                { id: 'valor', label: 'Valor (R$)', type: 'number', placeholder: '0.00' }
            ], async (res) => {
                const valor = parseFloat(String(res.valor).replace(',', '.'));
                if (res.nome && !isNaN(valor) && valor >= 0) {
                    catalogo[indexCat].itens.push({ nome: fixEncoding(res.nome.trim()), valor: valor });
                    await salvarCatalogoNoFirebase();
                } else {
                    customAlert("Preencha um nome e valor válidos!");
                }
            });
        };
        window.editarProdutoEstoque = (indexCat, indexItem) => {
            const item = catalogo[indexCat].itens[indexItem];
            customPrompt("Editar Produto", [
                { id: 'nome', label: 'Nome do Produto', value: item.nome },
                { id: 'valor', label: 'Valor (R$)', type: 'number', value: item.valor }
            ], async (res) => {
                const valor = parseFloat(String(res.valor).replace(',', '.'));
                if (res.nome && !isNaN(valor) && valor >= 0) {
                    item.nome = fixEncoding(res.nome.trim());
                    item.valor = valor;
                    await salvarCatalogoNoFirebase();
                }
            });
        };
        window.excluirProdutoEstoque = (indexCat, indexItem) => {
            customConfirm("Remover este produto do cardápio?", async () => {
                catalogo[indexCat].itens.splice(indexItem, 1);
                await salvarCatalogoNoFirebase();
            });
        };
        window.excluirCategoria = (indexCat) => {
            customConfirm("ATENÇÃO: Excluir esta categoria e todos os produtos dentro dela?", async () => {
                catalogo.splice(indexCat, 1);
                await salvarCatalogoNoFirebase();
            });
        };

        // --- HISTÓRICO LÓGICA E PESQUISA ---
        window.pesquisarHistorico = () => renderizarHistorico(document.getElementById('busca-historico').value);

        function renderizarHistorico(filtro = '') {
            const lista = document.getElementById('lista-historico');
            lista.innerHTML = '';
            const termo = filtro.toLowerCase().trim();

            const histFiltrado = historico.filter(h => 
                termo === '' || 
                fixEncoding(h.cliente).toLowerCase().includes(termo) || 
                (h.dataFinalizacao && h.dataFinalizacao.toLowerCase().includes(termo))
            );

            if (histFiltrado.length === 0) {
                lista.innerHTML = '<p style="color:var(--text-muted);">Nenhum histórico encontrado.</p>';
                return;
            }

            histFiltrado.forEach(h => {
                const isExpanded = termo !== '' ? '' : 'hidden'; 
                const btnText = termo !== '' ? '🔼 Ocultar Detalhes' : '🔽 Ver Detalhes';
                
                let itensHTML = h.itens.map(i => `
                    <div class="item-row" style="background:var(--bg);">
                        <div class="item-info"><span class="item-qtd">${i.quantidade || 1}x</span> ${fixEncoding(i.nome)}</div>
                        <span style="font-size:0.8rem;">R$ ${(i.valor * (i.quantidade || 1)).toFixed(2)}</span>
                    </div>`).join('');

                lista.innerHTML += `
                    <div class="history-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem;">
                            <strong style="font-size: 1.1rem; color: var(--info);">${fixEncoding(h.cliente)}</strong>
                            <strong style="font-size: 1.1rem; color: var(--success);">R$ ${h.total.toFixed(2)}</strong>
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">📅 ${h.dataFinalizacao || 'Sem data'}</div>
                        
                        <button id="btn-toggle-hist-${h.id}" class="btn-toggle-itens" onclick="toggleItensGerais('itens-hist-${h.id}', 'btn-toggle-hist-${h.id}')">
                            ${btnText}
                        </button>
                        <div id="itens-hist-${h.id}" class="${isExpanded}" style="margin-top:0.5rem;">
                            ${itensHTML}
                        </div>
                    </div>`;
            });
        }

        // --- IMPORTAR EXCEL COM SUPORTE UTF-8 PERFEITO ---
        window.importarExcel = () => {
            const fileInput = document.getElementById('file-excel');
            if (!fileInput.files.length) return customAlert("Selecione um arquivo Excel (.xlsx ou .csv) primeiro!");
            
            const file = fileInput.files[0];
            const isCsv = file.name.toLowerCase().endsWith('.csv');
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                try {
                    let workbook;
                    if (isCsv) {
                        const text = e.target.result;
                        workbook = XLSX.read(text, { type: 'string', codepage: 65001 });
                    } else {
                        const data = new Uint8Array(e.target.result);
                        workbook = XLSX.read(data, { type: 'array', codepage: 65001 });
                    }
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json.length === 0) return customAlert("A planilha está vazia!");

                    let novoCatalogoMap = {};

                    json.forEach((row, index) => {
                        const getVal = (keys) => {
                            for (let k in row) {
                                const cleanKey = k.toLowerCase().trim();
                                if (keys.some(key => cleanKey.includes(key))) return row[k];
                            }
                            return null;
                        };

                        let catNome = getVal(["categoria", "grupo", "seção", "secao"]) || "Sem Categoria";
                        let prodNome = getVal(["produto", "nome", "item", "descrição", "descricao"]) || `Produto Linha ${index + 2}`;
                        let prodValor = getVal(["valor", "preço", "preco"]) || 0;

                        catNome = fixEncoding(String(catNome).trim());
                        prodNome = fixEncoding(String(prodNome).trim());

                        if (typeof prodValor === 'string') {
                            prodValor = parseFloat(prodValor.replace('R$', '').replace(/\s/g, '').replace(',', '.'));
                        }
                        if (isNaN(prodValor)) prodValor = 0;

                        if (!novoCatalogoMap[catNome]) novoCatalogoMap[catNome] = [];
                        novoCatalogoMap[catNome].push({ nome: prodNome, valor: prodValor });
                    });

                    let novoCatalogoArray = [];
                    for (let c in novoCatalogoMap) {
                        novoCatalogoArray.push({ nomeCat: c, itens: novoCatalogoMap[c] });
                    }

                    customConfirm("ATENÇÃO: Importar esta planilha irá substituir TODO o estoque atual. Deseja continuar?", async () => {
                        catalogo = novoCatalogoArray;
                        await salvarCatalogoNoFirebase();
                        customAlert("Estoque atualizado com sucesso via Planilha!");
                        document.getElementById('file-excel').value = '';
                        mudarAba('produtos');
                    });

                } catch (error) {
                    console.error(error);
                    customAlert("Erro ao processar a planilha. Verifique se o arquivo está correto.");
                }
            };
            
            if (isCsv) {
                reader.readAsText(file, "UTF-8");
            } else {
                reader.readAsArrayBuffer(file);
            }
        };

        // --- LÓGICA DO MODAL ---
        window.abrirModalProdutos = (idComanda) => {
            comandaAtualId = idComanda; voltarParaCategorias();
            const viewCat = document.getElementById('modal-view-categorias'); viewCat.innerHTML = '';
            catalogo.forEach((cat, index) => {
                viewCat.innerHTML += `<button class="btn-categoria" onclick="entrarNaCategoria(${index})">${fixEncoding(cat.nomeCat)}</button>`;
            });
            document.getElementById('modal-produtos').classList.remove('hidden');
        };
        window.fecharModal = () => { document.getElementById('modal-produtos').classList.add('hidden'); comandaAtualId = null; };
        window.voltarParaCategorias = () => {
            document.getElementById('modal-search').value = '';
            document.getElementById('modal-view-itens').classList.add('hidden');
            document.getElementById('modal-view-categorias').classList.remove('hidden');
        };
        window.entrarNaCategoria = (indexCat) => {
            document.getElementById('modal-view-categorias').classList.add('hidden');
            document.getElementById('modal-view-itens').classList.remove('hidden');
            const cat = catalogo[indexCat];
            document.getElementById('titulo-categoria-modal').innerText = fixEncoding(cat.nomeCat);
            const lista = document.getElementById('modal-lista-produtos'); lista.innerHTML = '';
            cat.itens.forEach(item => {
                lista.innerHTML += `
                    <button class="produto-btn" onclick="adicionarItemRapido('${fixEncoding(item.nome)}', ${item.valor})">
                        <span class="nome">${fixEncoding(item.nome)}</span>
                        <span class="preco">R$ ${item.valor.toFixed(2)}</span>
                    </button>`;
            });
        };
        window.pesquisarProdutoModal = () => {
            const termo = document.getElementById('modal-search').value.toLowerCase().trim();
            if (termo === '') return voltarParaCategorias();
            document.getElementById('modal-view-categorias').classList.add('hidden');
            document.getElementById('modal-view-itens').classList.remove('hidden');
            document.getElementById('titulo-categoria-modal').innerText = `Busca: "${termo}"`;
            const lista = document.getElementById('modal-lista-produtos'); lista.innerHTML = '';
            let achou = false;
            catalogo.forEach(cat => cat.itens.forEach(item => {
                if (fixEncoding(item.nome).toLowerCase().includes(termo)) {
                    achou = true;
                    lista.innerHTML += `
                        <button class="produto-btn" onclick="adicionarItemRapido('${fixEncoding(item.nome)}', ${item.valor})">
                            <span class="nome">${fixEncoding(item.nome)}</span><span class="preco">R$ ${item.valor.toFixed(2)}</span>
                        </button>`;
                }
            }));
            if(!achou) lista.innerHTML = `<p style="color:var(--text-muted); width:100%; text-align:center;">Nada encontrado.</p>`;
        };
        window.adicionarItemRapido = async (nome, valor) => {
            const comanda = comandas.find(c => c.id === comandaAtualId);
            const itemExistente = comanda.itens.find(i => fixEncoding(i.nome) === fixEncoding(nome));
            if (itemExistente) itemExistente.quantidade = (itemExistente.quantidade || 1) + 1;
            else comanda.itens.push({ nome: fixEncoding(nome), valor: valor, quantidade: 1 });
            const total = comanda.itens.reduce((acc, it) => acc + (it.valor * (it.quantidade || 1)), 0);
            await updateDoc(doc(db, "comandas", comandaAtualId), { itens: comanda.itens, total: total });
            let btnMsg = document.createElement("div"); btnMsg.innerText = "+1 " + fixEncoding(nome);
            btnMsg.style = "position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--primary); color:#000; padding:12px 24px; border-radius:30px; z-index:2000; font-weight:bold;";
            document.body.appendChild(btnMsg); setTimeout(() => btnMsg.remove(), 1000);
        };
        window.adicionarItemManual = () => {
            customPrompt("Adicionar Item Avulso", [
                { id: 'nome', label: 'Nome do Produto' },
                { id: 'valor', label: 'Valor (R$)', type: 'number', placeholder: '0.00' }
            ], (res) => {
                const valor = parseFloat(String(res.valor).replace(',', '.'));
                if (res.nome && !isNaN(valor) && valor >= 0) {
                    adicionarItemRapido(fixEncoding(res.nome.trim()), valor);
                    fecharModal();
                } else {
                    customAlert("Preencha um nome e valor válidos!");
                }
            });
        };
    </script>
</body>
</html>
